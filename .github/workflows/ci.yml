# CI/CD for MXM Studio.
#
# Every push to main or to a feat/** branch, and every pull request, runs
# the full test pyramid:
#   1. rust  — rustfmt check, native tests of the core (includes synthetic
#              end-to-end roundtrips: sheet → simulated scan → recovered
#              frames), then clippy with warnings as errors, natively and for wasm32 (the
#              only target that compiles api.rs, the WebAssembly boundary).
#   2. web   — compiles the core to WebAssembly, type-checks the TypeScript
#              (tsc, strict, three projects), lints and checks formatting
#              (biome), builds the site, runs the
#              browser end-to-end test (real Chrome, workers + WASM) and
#              deploys that exact build to Cloudflare (mxm.sebastianlopez.me),
#              Pages-style. The deploy step is the only one gated to main.
# The web job waits for the rust job, so nothing is published that has not
# passed both. The deploy deliberately lives inside the web job rather than
# in one of its own: it publishes the dist it just tested, with no artifact
# in between and no second build to keep in sync.
#
# The deploy runs on a push to `main` AND on a manual run (workflow_dispatch)
# of `main`. It never runs for a pull request: the repository is public, so
# anyone can open one, and a fork must not be able to publish. Manual runs are
# allowed because otherwise the only way to republish — after adding a secret,
# or to redo a deploy that was skipped — is to invent a commit.
#
# Deploy requires two repository secrets:
#   CLOUDFLARE_API_TOKEN  — API token with "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id
# Until the token secret exists, the deploy step reports itself as skipped
# and the workflow stays green. That means a green run is NOT by itself proof
# that the site was published: check the deploy step, or the Worker's
# modified_on.
#
# Every third-party action is pinned to a commit SHA, not to a tag. A tag is
# mutable: whoever owns the action can move it to different code, and that
# code runs in this job, which can read the deploy token. The version comment
# next to each SHA is what the SHA was when it was pinned; to upgrade, change
# both together.

name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Core (cargo test + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Rust version lives in rust-toolchain.toml, so that CI and every
      # developer machine run the same compiler and the same clippy. The
      # action defaults to `stable`, which would install a second toolchain
      # and lint with whichever clippy that happens to be, so the channel is
      # read from the file and handed to it.
      - name: Read the pinned Rust version
        id: rust
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: rust-core
      # Formatting first: it is the cheapest check and the one that fails
      # for the most boring reason. rustfmt.toml keeps the default style.
      - name: Formatting (rustfmt)
        run: cargo fmt --check
        working-directory: rust-core
      - name: Tests (native, includes e2e roundtrips)
        run: cargo test --release
        working-directory: rust-core

      # Warnings are errors. The backlog that used to make this step
      # informational has been cleared; the two lints the code disagrees with
      # are allowed, with the reason, in the [lints] table of Cargo.toml.
      # `--all-targets` covers the unit and integration tests too.
      - name: Clippy (native, warnings are errors)
        run: cargo clippy --release --all-targets -- -D warnings
        working-directory: rust-core
      # api.rs is `#![cfg(target_arch = "wasm32")]`: the native run above
      # never compiles it, so the WebAssembly boundary gets its own pass.
      - name: Clippy (wasm32, warnings are errors)
        run: cargo clippy --release --target wasm32-unknown-unknown -- -D warnings
        working-directory: rust-core

  web:
    name: Web (tsc + WASM build + browser E2E + deploy)
    # The deploy comes out of this job, so it has to wait for the native tests
    # of the core: publishing something that has not passed them would be
    # worse than taking a minute and a half longer. That is the only reason
    # these two jobs no longer run in parallel.
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned Rust version
        id: rust
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: rust-core

      # This used to be `curl … | sh`, which runs whatever that URL serves at
      # the moment the job runs, with no record of what that was. This job can
      # reach the deploy step below, so it is worth pinning: fixed version,
      # and the archive is rejected unless its checksum matches.
      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: v0.15.0
          WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        run: |
          set -euo pipefail
          pkg="wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          curl -sSLf -o wasm-pack.tar.gz \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/${WASM_PACK_VERSION}/${pkg}.tar.gz"
          echo "${WASM_PACK_SHA256}  wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf wasm-pack.tar.gz -C "$HOME/.cargo/bin" --strip-components=1 "${pkg}/wasm-pack"
          rm wasm-pack.tar.gz
          wasm-pack --version

      - name: Compile core to WebAssembly
        run: wasm-pack build --release --target web --out-dir ../web/src/wasm
        working-directory: rust-core
      # Node 24: the web scripts (prepare-ffmpeg.mts, e2e-run.mts) are
      # TypeScript that Node runs directly by stripping the types, which is
      # on without a flag since 22.18 and without a warning since 24.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      # Types are checked BEFORE anything is built: Vite only strips the
      # annotations, it never verifies them, so without this step a type
      # error would reach the bundle. `npm run build` repeats it for manual
      # builds; here it stands alone so a failure reads as what it is.
      - name: Type check (tsc)
        run: npm run typecheck
        working-directory: web
      # Biome: lint and formatting in one pass, against web/biome.jsonc. It
      # replaces ESLint + Prettier because the web compiles with TypeScript 7,
      # whose npm package no longer ships the JavaScript compiler API that
      # typescript-eslint needs. `biome check` fails on any lint error and on
      # any file that is not formatted; `npm run lint:fix` repairs both.
      - name: Lint and formatting (biome)
        run: npm run lint
        working-directory: web
      - name: Install ffmpeg (generates the WebCodecs E2E sample video)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Browser end-to-end test (headless Chrome)
        run: npm run test:e2e
        working-directory: web
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Production build
        run: npm run build
        working-directory: web

      # Best effort ON PURPOSE, and no longer on the way to the deploy.
      # Actions storage is one quota shared by the whole organisation; when it
      # fills, this upload fails, and while the deploy lived in its own job
      # downloading this artifact, that failure took the deploy with it — the
      # site went unpublished with every test green. The artifact is now only
      # a convenience for downloading a build, so losing it costs nothing.
      - name: Upload site artifact (best effort)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: dist
          path: web/dist
          retention-days: 1

      # The deploy happens HERE, from the dist this job just built and tested,
      # so there is exactly one build in the pipeline: what gets published is
      # byte for byte what the browser E2E ran against. A separate job would
      # have to either receive the build through an artifact (the failure
      # above) or build it a second time — and a second build is a second
      # place to keep in sync, which is how the site once shipped without its
      # ffmpeg decoder.
      - name: Check deploy credentials
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # BOTH are required. The account id used to live in wrangler.jsonc
          # and is now only a secret, so checking the token alone would let
          # the job pass this gate and then fail inside wrangler — or, worse,
          # publish to whichever account the token can reach.
          missing=""
          [ -n "$CF_TOKEN" ] || missing="CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="${missing:+$missing and }CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$missing" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$missing not set — skipping deploy. Add it in Settings → Secrets to enable automatic deploys."
          fi
      - name: Deploy (wrangler)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.creds.outputs.have == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          # wrangler 3 does not understand the Worker config with static
          # assets. Action v4 already defaults to wrangler 4; this stays
          # explicit so a change of default cannot silently take the site back.
          wranglerVersion: "4"
