# CI/CD for MXM Studio.
#
# Every push and pull request runs the full test pyramid:
#   1. rust  — native tests of the core (includes synthetic end-to-end
#              roundtrips: sheet → simulated scan → recovered frames).
#   2. web   — compiles the core to WebAssembly, builds the site, runs the
#              browser end-to-end test (real Chrome, workers + WASM) and, on
#              a push to `main`, deploys that exact build to Cloudflare
#              (mxm.sebastianlopez.me), Pages-style.
# The web job waits for the rust job, so nothing is published that has not
# passed both. The deploy deliberately lives inside the web job rather than
# in one of its own: it publishes the dist it just tested, with no artifact
# in between and no second build to keep in sync.
#
# Deploy requires two repository secrets:
#   CLOUDFLARE_API_TOKEN  — API token with "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id
# Until the token secret exists, the deploy step reports itself as skipped
# and the workflow stays green.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core (tests + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
      - name: Tests (native, includes e2e roundtrips)
        run: cargo test --release
        working-directory: rust-core
      - name: Clippy (informational)
        run: cargo clippy --release --all-targets 2>&1 | tail -5
        working-directory: rust-core

  web:
    name: Web (WASM build + browser E2E + deploy)
    # El despliegue sale de este job, así que tiene que esperar a los tests
    # nativos del núcleo: publicar algo que no los ha pasado sería peor que
    # tardar minuto y medio más. Es el único motivo por el que estos dos jobs
    # ya no corren en paralelo.
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Compile core to WebAssembly
        run: wasm-pack build --release --target web --out-dir ../web/src/wasm
        working-directory: rust-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Install ffmpeg (generates the WebCodecs E2E sample video)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Browser end-to-end test (headless Chrome)
        run: npm run test:e2e
        working-directory: web
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Production build
        run: npm run build
        working-directory: web

      # Best effort ON PURPOSE, and no longer on the way to the deploy.
      # Actions storage is one quota shared by the whole organisation; when it
      # fills, this upload fails, and while the deploy lived in its own job
      # downloading this artifact, that failure took the deploy with it — the
      # site went unpublished with every test green. The artifact is now only
      # a convenience for downloading a build, so losing it costs nothing.
      - name: Upload site artifact (best effort)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: dist
          path: web/dist
          retention-days: 1

      # The deploy happens HERE, from the dist this job just built and tested,
      # so there is exactly one build in the pipeline: what gets published is
      # byte for byte what the browser E2E ran against. A separate job would
      # have to either receive the build through an artifact (the failure
      # above) or build it a second time — and a second build is a second
      # place to keep in sync, which is how the site once shipped without its
      # ffmpeg decoder.
      - name: Check deploy credentials
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set — skipping deploy. Add it in Settings → Secrets to enable automatic deploys."
          fi
      - name: Deploy (wrangler)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.creds.outputs.have == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          # la acción instala wrangler 3 por defecto, que no entiende la
          # config de Worker con assets estáticos
          wranglerVersion: "4"
