# CI de MXM Studio: prueba el núcleo Rust (con sus tests de integración de
# punta a punta) y construye la web en cada push y pull request.
# La app de escritorio original vive en legacy-desktop/ y ya no se prueba aquí.

name: Tests

on:
  push:
    branches: ["main", "web-wasm"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Núcleo Rust (tests nativos)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
      - name: Tests
        run: cargo test --release
        working-directory: rust-core

  web:
    name: Web (wasm + build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
      - name: Instalar wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Compilar núcleo a WebAssembly
        run: wasm-pack build --release --target web --out-dir ../web/src/wasm
        working-directory: rust-core
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Construir la web
        run: npm ci && npm run build
        working-directory: web
